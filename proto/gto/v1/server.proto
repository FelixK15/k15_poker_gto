// K15 GTO API contract, v1.
//
// This file is the source of truth for client/server communication.
// C++ code is generated by CMake (see proto/CMakeLists.txt); Dart code by
// tools/gen_dart.ps1 / tools/gen_dart.sh into app/lib/src/gen.
//
// The other services live in their own files: trees.proto, jobs.proto and
// solutions.proto. Locks and Ranges follow with their milestones; see PLAN.md
// section 4.1.
//
// Every call must carry the server's access token, if it has one, as the
// metadata entry "authorization: Bearer <token>".

syntax = "proto3";

package gto.v1;

// Basic information about a solver server and liveness checks.
service ServerService {
  // Static facts about the server and the machine it runs on.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);

  // Cheap liveness check. Echoes the payload.
  rpc Ping(PingRequest) returns (PingResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  // Server release, e.g. "0.1.0".
  string server_version = 1;
  // Version of the solver engine library linked into the server.
  string engine_version = 2;
  // API contract version. Clients refuse to talk to a different major version.
  uint32 api_major = 3;
  uint32 api_minor = 4;
  // "windows" or "linux".
  string os = 5;
  // Logical CPU cores available to the solver.
  uint32 logical_cores = 6;
  // Physical RAM of the machine, in bytes.
  uint64 total_memory_bytes = 7;
  // RAM currently available, in bytes.
  uint64 available_memory_bytes = 8;
}

message PingRequest {
  string payload = 1;
}

message PingResponse {
  string payload = 1;
}
