// Sizing up a spot before solving it.

syntax = "proto3";

package gto.v1;

import "gto/v1/common.proto";

service TreeService {
  // Checks a spot and reports how large its tree is and how much memory a
  // solve needs. Fails with INVALID_ARGUMENT if the spot cannot be solved at
  // all (bad board, unreadable range, …).
  rpc EstimateTree(EstimateTreeRequest) returns (EstimateTreeResponse);
}

message EstimateTreeRequest {
  Spot spot = 1;
}

message EstimateTreeResponse {
  uint64 nodes = 1;
  uint64 decision_nodes = 2;
  // Hands in each range that are possible on the board.
  uint32 oop_hands = 3;
  uint32 ip_hands = 4;
  // Memory for regrets and strategies, and for the tree itself.
  uint64 strategy_bytes = 5;
  uint64 tree_bytes = 6;
  // The tree exceeds the server's node limit. The numbers above are then
  // lower bounds, counted up to the limit.
  bool too_large = 7;
  // Whether the server would accept the spot: within the node limit and
  // within its memory budget.
  bool can_solve = 8;
  // The server's memory budget for one solve.
  uint64 memory_budget_bytes = 9;

  // Hands each player can hold on the board, in seat order (oop_hands and
  // ip_hands stay filled for two players).
  repeated uint32 player_hands = 10;
  // Monte Carlo: information sets of the abstracted game (betting sequences
  // times buckets). 0 for the exact engine; see strategy_entries.
  uint64 info_sets = 11;
  // Exact engine: action-hand pairs over all decisions (each costs two
  // values in strategy_bytes).
  uint64 strategy_entries = 12;
  // The engine a submit of this spot would run on (never AUTO).
  Engine engine = 13;
  // What the job's exploitability would mean.
  ExploitabilityKind exploitability_kind = 14;
  // Players and their position names, in seat order.
  uint32 player_count = 15;
  repeated string positions = 16;
}
