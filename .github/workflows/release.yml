name: Release

# Builds the Windows packages and the Android APK and publishes them as a GitHub release.
#
# Start it either way:
#   - push a tag named after the version in CMakeLists.txt, e.g. `git tag v0.1.0 && git push origin v0.1.0`
#   - run it by hand from the Actions tab; it then tags the commit with v<version from CMakeLists.txt>
#
# Release builds are made without server.defines.json, so they carry no server address or token.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from CMakeLists.txt
        id: read
        shell: bash
        run: |
          version=$(sed -nE 's/.*project\(k15_gto VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then echo "No version found in CMakeLists.txt"; exit 1; fi
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($tag)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows packages
    needs: version
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Locate vcpkg
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Update vcpkg to a version that knows our baseline
        shell: bash
        run: |
          git -C "$VCPKG_INSTALLATION_ROOT" pull --ff-only origin master
          "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      # Same key as the CI workflow, so a release reuses the packages CI already built.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-

      - name: Create cache directory
        shell: bash
        run: mkdir -p .vcpkg-cache

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get app packages
        working-directory: app
        run: flutter pub get

      - name: Build, test and package
        shell: pwsh
        run: ./tools/package_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Name the APK after the version
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/k15-gto-android-${{ needs.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its files."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "K15 GTO $TAG" \
              --generate-notes
          fi
