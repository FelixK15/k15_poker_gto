name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: ubuntu-latest
            preset: linux
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The runner images ship vcpkg; point VCPKG_ROOT at it.
      # Building gRPC from source fills the small system drive on Windows runners
      # if vcpkg keeps its build trees there, so keep them in the runner's temp
      # directory (on the larger drive) and delete each one once it is built.
      - name: Locate vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          buildtrees="$(echo "$RUNNER_TEMP" | tr '\\' '/')/vcpkg-buildtrees"
          echo "VCPKG_INSTALL_OPTIONS=--clean-after-build;--x-buildtrees-root=$buildtrees" >> "$GITHUB_ENV"

      - name: Update vcpkg to a version that knows our baseline
        shell: bash
        run: |
          # The runner's checkout may have local changes, which a pull refuses to
          # overwrite. It is thrown away after the job, so just reset it.
          git -C "$VCPKG_INSTALLATION_ROOT" fetch origin master
          git -C "$VCPKG_INSTALLATION_ROOT" reset --hard FETCH_HEAD
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      # gRPC takes a long time to build; cache the built packages.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Create cache directory
        shell: bash
        run: mkdir -p .vcpkg-cache

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Pinned to the release the app is developed with. Newer ones deprecate
      # package:flutter/material.dart and need a newer Android Gradle Plugin;
      # move up deliberately, together with those changes.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
